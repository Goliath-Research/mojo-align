[project]
name = "mojo-align"
version = "0.1.0"
description = "Mojo align monorepo (gpu-common, fq2bam-meth, giraffe, methylgrapher)"
# Only methylgrapher/ is MIT (see methylgrapher/LICENSE). Other packages have no open-source license.
authors = ["David Izada Rodriguez <davidizadar@GoliathResearch.com>"]

[dependencies]
# Mojo standard library is bundled with the MAX/Mojo toolchain.

[tool.magic]
channel = "https://conda.modular.com/max"

[scripts]
run = "mojo -I gpu-common/src -I fq2bam-meth/src -I giraffe/src -I methylgrapher/src methylgrapher/src/main.mojo"
test = "python -m pytest"
