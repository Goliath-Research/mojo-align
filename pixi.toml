[workspace]
name = "mojo-align"
version = "0.1.0"
description = "Mojo align monorepo: gpu-common, fq2bam-meth, giraffe, methylgrapher"
authors = ["David Izada Rodriguez <davidizadar@GoliathResearch.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-aarch64"]

[dependencies]
modular = "*"
python = ">=3.11,<3.14"
pytest = ">=9.1.1,<10"

[tasks]
run = "mojo -I gpu-common/src -I fq2bam-meth/src -I giraffe/src -I methylgrapher/src -I numeric/src methylgrapher/src/main.mojo"
help = "mojo -I gpu-common/src -I fq2bam-meth/src -I giraffe/src -I methylgrapher/src -I numeric/src methylgrapher/src/main.mojo help"
numeric-probe = "mojo -I gpu-common/src -I numeric/src numeric/src/centroid_kernels.mojo"
test = "python -m pytest"
